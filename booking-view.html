<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Booking Details | Shree Ram Tours & Travels</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><img src="logo.svg" alt="Shree Ram"><span>Shree Ram <small>TOURS & TRAVELS</small></span></a><button class="menu-btn" id="menuBtn">☰</button><nav id="nav"><a href="index.html">Home</a><a href="packages.html">Tours</a><a href="vehicles.html">Vehicles</a><a href="booking.html">Book Now</a><a href="customer-login.html">Account</a></nav></div></header><main><section class="page-hero compact-hero"><div class="container"><span class="pill">BOOKING DETAILS</span><h1 id="bvTitle">Your booking</h1><p id="bvStatus"></p></div></section><section class="section"><div class="container narrow"><div id="bookingView" class="booking-detail-card">Loading...</div></div></section></main><div class="mobile-book"><a href="booking.html">🚐 <small>Book Now</small></a><a href="track-booking.html">🔎 <small>Track</small></a><a href="customer-login.html">👤 <small>Account</small></a></div><script src="app.js"></script><script>const t=localStorage.getItem('srt_customer_token');const id=new URLSearchParams(location.search).get('id');async function load(){if(!t){location.href='customer-login.html?next='+encodeURIComponent('booking-view.html?id='+id);return}const r=await fetch('/api/customer/me',{headers:{Authorization:'Bearer '+t}});if(!r.ok){localStorage.removeItem('srt_customer_token');location.href='customer-login.html?next='+encodeURIComponent('booking-view.html?id='+id);return}const d=await r.json(),b=(d.bookings||[]).find(x=>x.id===id);if(!b){document.querySelector('#bookingView').innerHTML='<div class="empty-box">Booking not found in your account.</div>';return}document.querySelector('#bvTitle').textContent=b.id;document.querySelector('#bvStatus').textContent=b.status+' • '+(b.paymentStatus||'Pending');document.querySelector('#bookingView').innerHTML=`<div class="detail-top"><div><span class="eyebrow">BOOKING ID</span><h2>${b.id}</h2><p>${b.from} → ${b.to}</p></div><span class="status-pill ${String(b.status).toLowerCase()}">${b.status}</span></div><div class="detail-grid"><div><span>Customer</span><b>${b.name}</b></div><div><span>Mobile</span><b>${b.phone}</b></div><div><span>Travel Date</span><b>${b.date}</b></div><div><span>Passengers</span><b>${b.passengers}</b></div><div><span>Vehicle</span><b>${b.vehicle}</b></div><div><span>Package</span><b>${b.package||'Vehicle only'}</b></div><div><span>Payment</span><b>${b.paymentStatus||'Pending'}</b></div><div><span>Total</span><b>₹${Number(b.fare||0).toLocaleString('en-IN')}</b></div></div><div class="detail-actions"><a class="btn primary" href="track-booking.html?id=${encodeURIComponent(b.id)}&phone=${encodeURIComponent(b.phone)}">📍 Track Trip</a><a class="btn outline" href="booking.html">Book Another Trip</a></div>`}load();</script></body></html>
